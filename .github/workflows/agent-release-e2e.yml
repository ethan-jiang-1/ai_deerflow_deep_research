name: Agent release E2E

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra operations --extra demo-tui
      - run: make lint
      - run: make test-assets
      - run: make test-req-coverage
      - run: make test

  release-acceptance:
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent
    env:
      RELEASE_E2E_CONFIRM: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra operations
      - name: Strict release preflight
        run: uv run --extra operations python scripts/release_preflight.py
      - name: Run isolated full-real acceptance
        run: make test-release-e2e
      - name: Upload redacted release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-e2e-report
          path: agent/.reports/release
          if-no-files-found: warn
          retention-days: 30
