schema: spec-driven

context: |
  ## Project: Deep Research on top of DeerFlow

  This repository carries DeerFlow 2.1.0 and builds a Deep Research system as a
  downstream consumer. `backend/` and `frontend/` are the upstream mirror and MUST
  remain unmodified. Deep Research code belongs to the project-owned top-level
  `agent/` package and may import public `deerflow.*` APIs; DeerFlow MUST NOT import
  the downstream package.

  ### Sources of truth

  Keep three kinds of statements separate:

  1. Current DeerFlow behavior is established by the checked-in source and example
     configuration, especially `backend/AGENTS.md`, `backend/langgraph.json`,
     `backend/packages/harness/deerflow/`, `config.example.yaml`, and
     `extensions_config.example.json`.
  2. Approved Deep Research architecture is established by
     `_backlog/plans/deerflow-native-deep-research-graph.md` and the numbered plans
     under `_backlog/plans/`. These are design decisions to implement, not claims
     that the implementation already exists.
  3. `_backlog/_reference/dpt/` is architecture analysis. It explains the DPT
     semantics being mapped, but it is not executable source and does not override
     verified DeerFlow behavior or the approved mapping.

  OpenSpec artifacts MUST label unknowns and proposed behavior. They MUST NOT turn
  an unverified assumption, planned interface, or DPT-specific mechanism into a
  statement about the current codebase.

  ### Verified DeerFlow facts

  - `backend/langgraph.json` registers one top-level graph:
    `lead_agent = deerflow.agents:make_lead_agent`.
  - The lead agent is a LangGraph agent. Its middleware chain is assembled from a
    required base plus optional/configured components, so the live middleware count
    varies. Do not describe a fixed count as a runtime invariant.
  - `deerflow.agents.create_deerflow_agent()` is the SDK factory for an embedded
    agent loop. Passing `middleware=[...]` is a full takeover of that embedded
    agent's middleware list and cannot be combined with `features` or
    `extra_middleware`. Its `checkpointer` is optional.
  - `config.yaml -> tools[].use` resolves a reflected `BaseTool`. Configured tools
    are combined with built-in, MCP, and ACP tools and deduplicated by name with
    configured tools first. A `tool_groups` allowlist narrows configured tools but
    is not, by itself, a complete security boundary.
  - `deerflow.runtime.checkpointer.async_provider.make_checkpointer(app_config)` is
    the official async context manager for memory, SQLite, and Postgres savers. The
    legacy `checkpointer` section takes precedence over `database`; otherwise the
    unified `database` selection is used.
  - Tool runtime context is installed server-side with thread/run/AppConfig data and
    authenticated Gateway identity. The generic `resolve_runtime_user_id()` helper
    falls back to `default` when explicit context is absent, so a security-sensitive
    downstream boundary must require the injected `runtime.context.user_id` instead
    of treating that fallback as authentication.
  - `ThreadDataMiddleware` places thread-data paths on runtime state. Sandbox state is
    lazy and may be absent on a fresh thread until
    `deerflow.sandbox.tools.ensure_sandbox_initialized_async(runtime)` acquires the
    parent sandbox. A downstream tool that requires sandbox authority must use and
    validate that public path rather than create another sandbox lifecycle.
  - Current custom Agent writes are per-user at
    `{DEER_FLOW_HOME}/users/{user_id}/agents/{name}/`. The shared
    `{DEER_FLOW_HOME}/agents/{name}/` layout is a read-only legacy fallback for new
    work. `POST /api/agents` is available only when `agents_api.enabled=true` and
    writes through the authenticated effective user.
  - Public skills are read from the global `skills/public/` tree and their enabled
    state is stored in `extensions_config.json`. New editable custom skills are
    per-user; the global `skills/custom/` tree is a legacy fallback.
  - Skills, memory, summarization, subagents, and most guardrails are configurable
    features. Their existence in the framework does not mean they are enabled for
    every agent or selected for Deep Research.
  - The authoritative restart-required registry is
    `deerflow.config.reload_boundary.STARTUP_ONLY_FIELDS`. It currently includes
    `database`, `checkpointer`, `run_events`, `stream_bridge`, `sandbox`,
    `log_level`, `logging`, `channels`, `channel_connections`, and `scheduler`.

  ### Verified version floors

  - Python >=3.12.
  - Harness: langchain>=1.2.15, langgraph>=1.1.9, pydantic>=2.12.5,
    sqlalchemy[asyncio]>=2.0,<3.0.
  - Gateway: fastapi>=0.115.0.
  - Frontend (not modified by this roadmap): pnpm@10.26.2, TypeScript ^5.8.2,
    Next ^16.2.6, React ^19.0.0, @langchain/langgraph-sdk ^1.5.3.

  The downstream `agent/pyproject.toml` MUST pin only dependencies it directly uses
  while remaining compatible with these floors. Async code MUST keep blocking file
  IO off the event loop, using `asyncio.to_thread` or an async API.

  ### Deep Research tech-stack decisions

  - **Durable checkpoint store = file-backed SQLite.** Deep Research is a long,
    intermittent ("silent") task: a run may pause and resume much later, spanning
    Gateway restarts. The graph control state (phase/gate/HITL suspension point)
    therefore MUST survive a process restart, so the `memory` checkpointer is not
    acceptable as the default. SQLite is chosen: it is a single on-disk file, needs
    no database server and no Docker, and is restart-durable. This is separate from
    research artifacts/evidence/ledger, which live in the sandbox file system
    (`/mnt/user-data/workspace/deep-research/<id>/...`), not in any database.
  - **Postgres and Docker-based provider verification are deferred.** Postgres is a
    later-change option for multi-worker/production; its Compose test profile and
    `make test-postgres` are out of scope for change 00. SQLite provider-reopen and
    real subprocess-restart durability are the change-00 durability gate and MUST
    pass without any database server or container.
  - **`memory` remains a valid dev/test provider** (same-process only, explicitly
    non-durable); `:memory:` SQLite is likewise classified same-process. Durability
    is claimed only for file-backed SQLite (and, later, Postgres).

  ### Approved Deep Research architecture

  This is a DPT-to-DeerFlow mapping, not a choice among unrelated workflows. Both
  systems are graph-controlled and agent-executed; the controller substrate differs:

  ```text
  DPT                                    DeerFlow mapping
  Phase Agent + Markdown controller  -> Python StateGraph + typed routers
  bundle control state               -> typed ResearchState + checkpointer
  phase agentic work                 -> bounded DeerFlow agent loop inside a node
  gate CLI and check.next            -> deterministic gate node + graph edge
  large evidence/report files        -> per-thread sandbox workspace
  validated submit                   -> submission ledger as evidence authority
  ```

  Python controls enumerable phase transitions, gate outcomes, retry limits, fan-out
  and fan-in, HITL interrupts, and resume. LLM agents decide open-ended research,
  synthesis, critique, and repair inside their assigned nodes. Node Markdown contains
  task contracts and prompts; it does not hold the global program counter.

  The first integration shape is a nested Deep Research `StateGraph` exposed through
  one reflected custom tool on the existing lead agent. A public entry skill and a
  per-user dedicated Agent route users to that tool. They are UX surfaces, not
  authorization boundaries.

  Research state has three distinct authorities:

  - typed/checkpointed `ResearchState` stores small control state, artifact refs,
    phase/gate/work status, and interrupt/resume state;
  - the per-thread sandbox stores large source, cache, evidence, and report files;
  - the deterministic submission ledger decides which validated evidence counts.

  Do not replace checkpointed control state with sandbox JSON files. Do not put large
  evidence bodies into checkpoints. File existence, agent text, or a run event is not
  equivalent to a validated submission.

  The worker execution path is a bounded agent built with
  `create_deerflow_agent()` and invoked by a runtime-owned bridge on behalf of the
  graph node. RuntimeAdapter stops at TrustedRuntimeEnvelope; a registered research
  handler must validate its opaque scope before runtime projection derives the research
  root and pure node contexts. The node sees only a pure capability protocol; the bridge
  alone seeds ephemeral child state/context with the parent sandbox, thread data, runtime
  attribution, and AppConfig. Raw binding data is never graph state or model input,
  and the child has no independent checkpointer. DeerFlow's `task` subagent system is
  a possible future adapter, not the default work-unit executor and not part of
  change 00.

  HITL occurs only in explicit graph-owned HITL nodes. A phase agent cannot call
  `ask_clarification`, advance phase, pass a gate, or mutate the ledger.

  ### Canonical downstream surfaces

  - Source root: `agent/src/deerflow_deep_research/`.
  - Stable reflected tool: `deerflow_deep_research.tool:deep_research_tool`.
  - Committed public skill source:
    `agent/config/public-skill/deep-research-controller/SKILL.md`.
  - Materialized public skill:
    `skills/public/deep-research-controller/SKILL.md`.
  - Committed Agent template: `agent/config/agent-template/{config.yaml,SOUL.md}`.
  - Runtime Agent:
    `{DEER_FLOW_HOME}/users/{user_id}/agents/deep-research/{config.yaml,SOUL.md}`.
  - Offline filesystem provisioning is only for synthetic user `default` when
    `DEER_FLOW_AUTH_DISABLED=1` is active outside production. Authenticated
    provisioning uses current-user `POST /api/agents`; an
    arbitrary operator `--user-id` is not an authentication mechanism.
  - Sandbox research root:
    `/mnt/user-data/workspace/deep-research/<research_id>/`.

  The research root is created only by runtime projection after a registered research
  handler validates the opaque research scope. Change 00's infrastructure probe validates
  its envelope/sandbox and diagnostic checkpoint namespace only; it does not create a
  research workspace, graph/node context projection, or agent loop.

  New design MUST NOT write Deep Research source under the repository root,
  `backend/`, or `frontend/`; MUST NOT write new Agent state under the shared legacy
  Agent path; and MUST NOT use `skills/custom/deep-research-controller/` as the new
  public entry surface. Phase prompts load from package resources and are not copied
  into skills.

  ### Configuration and mount contract

  Committed files under `agent/config/` are templates. Runtime truth is the effective
  `config.yaml` and `extensions_config.json` selected under the launch environment,
  canonical repo `skills/public/`, per-user Agent files, and `{DEER_FLOW_HOME}`.
  Configure and doctor must resolve the same config/extensions targets as Gateway and
  reject root/backend shadowing or inert fallback writes. Change 00 supports only the
  canonical repo skills root used by its local/Docker mount contract; an effective
  `skills.path` or `DEER_FLOW_SKILLS_PATH` elsewhere is runtime-not-ready. Agent-owned
  operations run from the separately locked agent project environment; they never add
  their operations-only dependencies to the Gateway environment.

  Change 00 adds or materializes only these DeerFlow-facing entries:

  - `config.yaml -> tool_groups[name=deep-research-control]`;
  - `config.yaml -> tools[name=deep_research]` with group
    `deep-research-control` and use path
    `deerflow_deep_research.tool:deep_research_tool`;
  - `extensions_config.json -> skills.deep-research-controller.enabled`;
  - the public skill and per-user dedicated Agent files listed above.

  `configure.py` uses a comment/order/style-preserving YAML round-trip parser and a
  structured JSON parser that preserves unknown data/key order and converges to
  byte-stable formatting. It is idempotent, supports check/dry-run/backup/redacted-
  diff plus a hash-guarded rollback manifest, and fails on same-name ownership
  conflicts. It does not overwrite changes made after its backup. Check/dry-run may
  run online; mutation and rollback have a stopped-Gateway operational precondition
  because Gateway APIs are independent config writers. Configured/known local health
  plus project-owned process/container checks enforce detected cases but cannot prove
  a remote shared-filesystem writer is absent. Tool/config/skill/Agent changes take
  effect on the next agent build.
  Package import path, `PYTHONPATH`, source mounts, and database/checkpointer/sandbox
  changes require a Gateway restart.

  Project launch assembly captures a secret-free fingerprint of effective
  database/checkpointer, sandbox, and worker-count startup inputs in
  `DEER_FLOW_DEEP_RESEARCH_STARTUP_FINGERPRINT`. Prelaunch doctor validates the freshly
  computed candidate without claiming to inspect a running process; runtime diagnostics,
  RuntimeAdapter, and GraphHost compare live request AppConfig to the fingerprint inherited
  by the process and never silently recompute a missing expected value. Drift fails
  `restart_required` before sandbox/provider access, preventing request-time config reload
  from splitting outer and nested runtime singletons. The wire value is strict
  `v1:<64 lowercase hex>` over a canonical typed snapshot; missing/malformed/unknown
  versions fail closed, and launchers assign structured output without shell evaluation.

  Gateway source is host-side only. Current upstream local launchers run exact
  `uv sync` and then set inline `PYTHONPATH=.`. For start/restart, the project launcher
  loads root `.env`, establishes the same runtime-path defaults and Gateway `backend/`
  working directory (which controls relative SQLite resolution), and performs
  config/prerequisite read-only preflight. The AppConfig path and current upstream
  config-upgrade target must resolve to the same canonical file; root/backend shadowing
  fails closed. Missing, invalid, older, or newer config versions are refused before
  shared backend-environment mutation. The launcher then delegates upstream stop before touching the shared backend
  environment, syncs dependencies, installs `agent/` editable, computes and validates the
  startup candidate, and delegates upstream start with `UV_NO_SYNC=1` plus
  `--skip-install`; stop delegates immediately without preflight or installation.
  A post-stop preparation/doctor failure leaves the stack stopped and is retried through
  locked exact preparation; it never claims environment rollback or restarts an old process.
  Docker uses a read-only source mount plus an explicit Gateway command override whose
  container prelude computes/exports the candidate and passes prelaunch doctor before
  unchanged uvicorn tokens; only runtime-not-ready blocks startup.
  `agent/src` is never mounted into the research sandbox; only DeerFlow's existing
  user-data/skills capabilities are visible there.

  A reflected tool has no project-owned Gateway lifespan hook. Therefore the initial
  `GraphHost` caches builders/topology, not live SQL resources. SQLite/Postgres actions
  open the official async checkpointer context, compile/invoke or inspect inside it,
  and close it deterministically. Effective-provider classification follows the same
  legacy `checkpointer`-over-`database` precedence as the official factory. A process-
  local memory saver and SQLite memory-mode connection can support same-process probes
  only; restart recovery is guaranteed only for file-backed SQLite/valid Postgres.

  Change 00 exposes only `deep_research(action="infra_probe")`. Its repeated invocation
  proves checkpoint write/read and provider reopen; it is not a fake research resume.
  GraphHost exposes a generic typed action-handler registry, not named research
  lifecycle methods. Change 01 adds the public `start | resume | status | cancel`
  fake-graph handlers in a separate research topology/checkpoint namespace; the
  infrastructure probe remains a distinct diagnostic topology.

  Doctor keeps `runtime_ready`, tri-state `entry_ready`, and `durability` separate.
  Known skill/Agent defects make entry not ready; unknown is reserved for an otherwise
  valid authenticated entry whose Agent cannot be attributed offline. Launchers and the
  blocking CLI exit status gate only on runtime readiness, so entry warnings cannot make
  the globally configured control tool unavailable. Change 00 normalizes missing/empty `GATEWAY_WORKERS` to the upstream
  default integer 1 and supports only that value; malformed, zero, negative, or greater
  values fail readiness rather than claiming process-local serialization is sufficient.

  ### Security boundaries

  Security is enforced in code by `RuntimeAdapter`, checkpoint namespace derivation,
  node-agent tool/path policy, deterministic submit, and gate validation. The public
  skill, dedicated Agent, SOUL, prompts, and tool groups only guide behavior.

  Identity, outer thread/run attribution, host/virtual paths, sandbox handles, and
  application configuration come from trusted runtime context/state. Runtime-only raw
  data lives in `TrustedRuntimeEnvelope`, runtime projection, and the concrete runtime
  node-agent bridge; graph nodes consume a pure domain capability protocol; model-facing
  `NodeAgentContext` contains only opaque refs, canonical virtual paths, and explicit
  policy. Tool schemas forbid caller-supplied authority fields. External source content
  is untrusted data: never place
  it in system/developer prompts or interpret embedded instructions as tool, control,
  gate, or ledger authority.

  Custom middleware passed only to the downstream embedded phase-agent factory is an
  additive use of `create_deerflow_agent()`. Modifying the lead-agent middleware chain,
  `backend/`, `frontend/`, or the registered lead graph is a separate explicit
  escalation and is forbidden by the current roadmap.

  ### Development conventions

  - Execute changes strictly in numbered order `00 -> 01 -> ... -> 18`.
  - TDD is mandatory. Infrastructure and policy behavior uses deterministic fakes;
    model-facing behavior normally uses short scripted external adapters through the
    real production interface. Persisted trace replay requires a concrete interleaving
    or stable-shape justification. Real-LLM coverage is supplemental, must be marked
    `@requires_llm`, and remains outside the deterministic PR path.
  - Tests live under `agent/tests/` and mirror package ownership. Change 00 creates
    project-owned `agent/Makefile` format, lint, test, configure, doctor, and launch
    commands. Do not run or require frontend checks when frontend is untouched.
  - Add concise `@impl XXX-001` traceability at the owning implementation surface.
  - Keep `agent/README.md`, `agent/AGENTS.md`, plans, and OpenSpec artifacts aligned
    with stable architecture decisions.

  ### Requirement traceability

  Every capability requirement has a globally unique, append-only ID
  `{PREFIX}-{NNN}`:

  - Registry: `openspec/governance/req-registry.yaml`.
  - Prefix: first two letters of the first word plus first letter of the second;
    a single-word capability uses its first three letters. Record the mapping in
    `prefixes:` and search before allocation.
  - Each active delta spec and each main spec declares owned IDs in one
    `> req: XXX-001, ...` line before the first `##` heading.
  - Requirement titles are stable semantic anchors and never contain IDs.
  - States: alive in a main spec, pending in an active delta, retired with
    `[DEPRECATED]` in the registry. IDs are never deleted or reused.

  Test-evidence authority and synchronization are defined by
  `openspec/governance/test-evidence-policy.md`; normative behavior remains in the
  active `evaluation-hardening` spec/delta and executable collection remains agent-owned.

  Before archive, all three root governance checks MUST pass:

  - `python3 openspec/governance/check_project_reqs.py`
  - `python3 openspec/governance/check_project_specs.py`
  - `python3 openspec/governance/check_project_architecture.py`

rules:
  proposal:
    - "Name every DeerFlow extension surface used: exact config.yaml section, extensions_config.json key, public/custom skill path, per-user Agent/SOUL, MCP, ACP, subagent, or downstream use: reflection path. State explicitly when a surface is unused."
    - "For Deep Research changes, name the graph nodes/components affected, typed state/checkpoint data affected, node-agent roles used, and sandbox artifacts read or written. Do not assume phase skills, DeerFlow task subagents, or DPT bundle control files."
    - "Non-goals MUST state that no files under backend/ or frontend/ are modified. Any exception is a separate BREAKING escalation."
    - "State next-agent-build versus Gateway-restart impact for every runtime configuration or mount change. Use reload_boundary.STARTUP_ONLY_FIELDS as the restart authority."
    - "For each new capability, allocate and register requirement IDs, then list them in the proposal."
    - "Describe approved future behavior as scope, not as behavior already present in the repository."
    - "For test-bearing changes, identify the evidence class and lowest responsible production seam, and justify any escalation to persisted trace replay, live dependencies, or full-system acceptance. Follow openspec/governance/test-evidence-policy.md."
  specs:
    - "Requirements describe observable or mechanically verifiable behavior of the downstream Deep Research package, runtime integration, configuration, and user entry surfaces; they do not redefine DeerFlow internals."
    - "Every capability MUST retain zero-API deterministic evidence at its lowest responsible seam; credentialed live/release scenarios are supplemental and require explicit bounds and scope. Behavioral workflow proof uses the real production loop with scripted external adapters; a patch-only wiring test cannot claim workflow behavior. Include at least one failure, denial, or fail-closed scenario per capability."
    - "Each active delta spec and each main spec MUST declare its owned IDs in a `> req: XXX-001, ...` line before the first `##` heading. Main specs additionally require `## Purpose` and `## Requirements`; delta operation headers are legal only under openspec/changes/<name>/specs/."
    - "Requirement titles are stable semantic anchors and never include requirement IDs."
  design:
    - "Separate verified current behavior, approved decisions, and unresolved questions. Cite exact files, config keys, reflection paths, and config.example.yaml anchors for integration claims."
    - "New code lives under agent/, may import public deerflow.* APIs, and MUST NOT be imported by or modify backend/ or frontend/. Keep blocking IO off the async event loop."
    - "Pin only directly used dependency floors compatible with the verified stack. Mark each changed field as next-agent-build or restart-required, citing reload_boundary.STARTUP_ONLY_FIELDS."
    - "Define ownership for typed state, sandbox artifacts, checkpoints, and submission authority; do not create two controllers or two persistent business-state authorities."
    - "For test design, distinguish short scripted cases, minimized provider-shape fixtures, and persisted trace replay; justify replay/live/E2E escalation and name every mutable process-global state a fixture must restore."
  tasks:
    - "TDD: pair each behavior implementation with a red-before-green deterministic test. Use the real workflow with scripted external adapters for model behavior, reserve persisted replay for a reviewed trace need, and gate any real-LLM test with @requires_llm."
    - "Implementation is additive under agent/, skills/public/deep-research-controller/, OpenSpec/docs, and structured runtime materialization. NEVER edit backend/ or frontend/."
    - "Reference requirement IDs in task text and annotate the owning implementation surface with `@impl XXX-001`."
    - "Include agent-owned format/lint/test, documentation sync, config/doctor checks, and an environment-appropriate end-to-end infra probe. Do not require frontend checks when frontend is unchanged."
    - "Directly test every changed validator rule with minimal invalid fixtures; add a known-violation smoke case when a collector, discovery/archive scan, or runtime detector could pass on empty or mis-scoped input. Restore only the mutable global state the fixture actually changes."
    - |
      Every change MUST end with these hard done-conditions before archive:
        1. `python3 openspec/governance/check_project_reqs.py` PASS with no duplicate, unregistered, orphan, or reused-retired IDs.
        2. `python3 openspec/governance/check_project_specs.py` PASS with no delta headers in main specs and no missing purpose, requirements, or requirement-ID header.
        3. `python3 openspec/governance/check_project_architecture.py` PASS with valid structure authority, registry, generated guide block, paths, imports, and node packages.
