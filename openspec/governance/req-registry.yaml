# Requirement ID Registry
#
# 需求 ID 的唯一登记处。借鉴自 deep-research 项目的治理思想，技术栈换成本仓库的
# Python + OpenSpec；这里只登记「我们在 DeerFlow 之上构建的智能体」的 capability 需求。
#
# 规则:
#   1. 只增不删 — 已分配的 ID 永不复用，废弃的在描述末尾追加 [DEPRECATED]
#   2. 分配前先查 — 在此文件中搜索确认 ID 未被占用
#   3. 格式:  PREFIX-NNN: <capability-name> — <description>
#      - key 是全局唯一 ID，格式 [A-Z]{3}-\d{3}
#      - value 的 <capability-name> 用 kebab-case
#   4. 引号:  YAML 值不需要引号，除非值内包含 ": "（冒号+空格）
#      例:  CUT-001: custom-tool — simple description          （无需引号）
#           CUT-002: "custom-tool — 含 colon: 需引号包裹"        （需引号）
#      切勿用单引号——YAML 单引号内无法转义，双引号用 \" 即可。
#   5. check_project_reqs.py 扫描本文件做一致性校验
#
# 三态:
#   alive   — ID 出现在 openspec/specs/ 某个 main spec 的 > req: 行
#   pending — ID 出现在 openspec/changes/<active>/specs/ 的 delta spec 中
#   retired — 本行末尾标了 [DEPRECATED]，ID 占位永不复用
#
# 缩写规则: 首单词前 2 字母 + 次单词首字母（如 custom-tool → CUT，memory-policy → MEP）；
#           单词型 capability 取前 3 字母（如 skills → SKI）。冲突时先查 registry 再定。

# ──────────────────────────────────────────────
# prefixes: 缩写 → kebab-case capability 全称
# 此映射块是唯一自文档化来源。key 不匹配 [A-Z]{3}-\d{3}，
# check_project_reqs.py 自动忽略。首个 capability 落地时在此登记缩写。
# ──────────────────────────────────────────────
prefixes:
  BON: bootstrap-node
  DEC: deployment-configuration
  EVC: evidence-critic-nodes
  GAK: gate-kernel
  HIN: hitl1-node
  NOA: node-agent-runtime
  PRS: project-structure
  RED: research-demo-tui
  REG: research-graph-lifecycle
  RUI: runtime-integration
  TOP: topic-planning-node
  WAN: wave0-node
  WON: wave1-node
  WOU: work-unit-kernel
  TEL: targeted-evidence-loop
  WSN: wave2-synthesis-node

# ──────────────────────────────────────────────
# Requirement IDs（按 capability 分组，组按字母序，组内按数字序）
# 示例（待第一个 change 落地时替换）:
#
#   # custom-tool
#   CUT-001: custom-tool — <一句话稳定语义描述>
#
# ──────────────────────────────────────────────

# bootstrap-node
BON-001: bootstrap-node — The real bootstrap atomically establishes the minimal research bundle directory tree and a schema/version marker under the canonical bundle root with crash recovery so a partial bundle is never observable as active or completed
BON-002: bootstrap-node — A real bootstrap gate built on the gate kernel validates bundle, control state, and checkpoint-bundle binding and solely determines the bootstrap route replacing the fake fixture pass without a research model call
BON-003: bootstrap-node — Bootstrap failure performs deterministic cleanup and bounded retry with typed failure codes and never invokes a research LLM or publishes an inconsistent bundle or route, failing closed to a terminal lifecycle when unrecoverable
BON-004: bootstrap-node — The real bootstrap preserves REG-004 start/resume/status/cancel invariants, keeps bundle establishment research-scoped, and fails closed on marker schema mismatch or cross-research binding without re-implementing path/user/thread isolation
BON-005: bootstrap-node — The real bootstrap swaps into the mixed implementation map in place of the fake while every other phase remains fake, preserving the normalized topology and the full-fake lifecycle end-to-end path

# deployment-configuration
DEC-001: deployment-configuration — Deep Research source loads through project-owned local, production, and Docker launch paths
DEC-002: deployment-configuration — Structured configuration materialization is idempotent and rejects ownership conflicts
DEC-003: deployment-configuration — The public entry skill is materialized and enabled from committed source
DEC-004: deployment-configuration — The dedicated Deep Research Agent is provisioned in the effective user's scope without legacy shared paths
DEC-005: deployment-configuration — Diagnostics separate runtime, entry, worker-count, provider durability, reload, and restart readiness without exposing secrets

# node-agent-runtime
NOA-001: node-agent-runtime — A runtime-owned bridge gives phase agents the parent sandbox and trusted ephemeral context without leaking authority or adding a checkpointer
NOA-002: node-agent-runtime — Phase-agent execution is bounded by explicit model-call, tool-call, token, output, result-size, and wall-time policy
NOA-003: node-agent-runtime — Phase-agent tool and filesystem access fails closed outside the active attempt policy
NOA-004: node-agent-runtime — External source content remains untrusted data and cannot change control instructions or authority
NOA-005: node-agent-runtime — Phase-agent results, progress, cancellation, and failures are normalized for the parent graph
NOA-006: node-agent-runtime — Phase agents cannot initiate user clarification outside graph-owned HITL nodes

# project-structure
PRS-001: project-structure — Deep Research code and tests use one canonical downstream package structure
PRS-002: project-structure — Import directions and shared-code ownership boundaries are enforced mechanically
PRS-003: project-structure — Top-level workflow nodes expose one stable NodeSpec surface with colocated deterministic fakes
PRS-004: project-structure — Canonical structural authority remains discoverable and mechanically synchronized after change archival

# research-demo-tui
RED-001: research-demo-tui — A standalone Textual demo drives the real full-fake lifecycle through both HITL requests without Gateway, model, or network dependencies
RED-002: research-demo-tui — The demo remains an explicitly non-product visualization with deterministic tests and no claim of formal DeerFlow TUI or Web UI integration

# runtime-integration
RUI-001: runtime-integration — DeerFlow exposes one stable Deep Research control tool with an infrastructure probe action
RUI-002: runtime-integration — Explicit server identity and parent thread/sandbox resources are validated and authority-reduced from trusted DeerFlow context
RUI-003: runtime-integration — Deep Research checkpoints use versioned collision-resistant namespaces with supported single-worker mutation serialization
RUI-004: runtime-integration — GraphHost manages a typed action registry and effective per-action checkpointer lifecycle without a Gateway lifespan hook
RUI-005: runtime-integration — Probe persistence behavior is explicit and verifiable for memory, SQLite, and Postgres backends
RUI-006: runtime-integration — The reflected Deep Research tool dispatches authority-reduced research lifecycle actions while preserving the independent infrastructure probe

# research-graph-lifecycle
REG-001: research-graph-lifecycle — One explicit topology and implementation map assemble every stable Deep Research phase from registered NodeSpec packages
REG-002: research-graph-lifecycle — Deterministic fake nodes exercise routing, repair, rerun, and parallel Send fan-in without models, web access, or sandbox research tools
REG-003: research-graph-lifecycle — Graph-owned HITL requests bridge to the existing human-input message contract and resume only from the matching latest HumanMessage response
REG-004: research-graph-lifecycle — Start, resume, status, and cancel enforce typed lifecycle transitions, idempotency, and fail-closed scope checks
REG-005: research-graph-lifecycle — Fake graph checkpoints, restart recovery, topology snapshots, and end-to-end paths remain isolated and deterministic
REG-006: research-graph-lifecycle — One typed versioned ResearchState is the canonical checkpointed control authority replacing the temporary skeleton state
REG-007: research-graph-lifecycle — State reducers enforce terminal monotonicity, duplicate-hash idempotency, different-hash conflict, ref dedupe, and sole-writer ownership
REG-008: research-graph-lifecycle — Large research content stays out of the checkpoint as path, hash, schema-version, and short-summary refs under a hard size bound
REG-009: research-graph-lifecycle — Checkpointed control state, the validated submission ledger, and sandbox artifact files remain three distinct authorities
REG-010: research-graph-lifecycle — A minimal research bundle layout and path-containment contract scope every sandbox write to its research and attempt root
REG-011: research-graph-lifecycle — A versioned ResearchState schema fails closed on incompatible versions and never silently resets or auto-migrates

# evidence-critic-nodes
EVC-001: evidence-critic-nodes — SourceDiagnostic agent produces a typed trust and materiality assessment from assigned accepted evidence with per-source trust tier, materiality, marketing risk, and cross-verification need
EVC-002: evidence-critic-nodes — ClaimVerifier agent produces typed evidence-backed claim assessment with verdicts (supported/weakened/contradicted/uncertain), support refs, counter refs, and reason referencing only assigned source ids
EVC-003: evidence-critic-nodes — Critics run as bounded read-only agent loops under a zero-tool read-only ExecutionPolicy and cannot write phase, gate, ledger, or another node's artifacts
EVC-004: evidence-critic-nodes — Critic output uses versioned structured Pydantic schema with deterministic materializer writing canonical JSON to the sandbox
EVC-005: evidence-critic-nodes — Author and critic use independent model configurations, prompt templates, and agent sessions with conflicting results recorded as gaps rather than majority-vote truth

# gate-kernel
GAK-001: gate-kernel — Gate definitions collect all rules and produce deterministic verdicts with typed PhaseVerdict and route_map
GAK-002: gate-kernel — Failure codes are a closed typed registry with stable classifications and no free-form codes from models or workers
GAK-003: gate-kernel — Gate is the sole writer of phase transition routing and feedback fields including route, latest_gate_feedback, gate_attempts_by_phase, and repair_budget_by_phase
GAK-004: gate-kernel — Bounded repair loop with per-phase budget, lazy initialization, fingerprint-based fatigue detection, and cross-phase fatigue isolation
GAK-005: gate-kernel — Fixture rules preserve all fake graph paths by wrapping the existing fixture_plan in typed GateDefinitions with phase-specific route resolution
GAK-006: gate-kernel — Rule evaluation is stable-ordered and deterministic with pure rules that perform no I/O, model calls, or state mutation

# hitl1-node
HIN-001: hitl1-node — Real HITL1 generates a validated structured brief from the original question through the runtime node-agent bridge with closed-enum profile dimensions and fail-closed schema validation
HIN-002: hitl1-node — Real HITL1 presents structured brief and follow-up prompts through the existing graph-owned interrupt protocol with bounded compact context and deterministic request ordinals
HIN-003: hitl1-node — Real HITL1 parses JSON or free-text human responses deterministically, accumulates durable partial profile progress, bounds follow-up rounds, and rejects forged or mismatched responses
HIN-004: hitl1-node — Real HITL1 records the validated profile as request-bundle profile.json plus checkpoint ContentRef and short controller-owned profile fields without bumping ResearchState schema version
HIN-005: hitl1-node — Real HITL1 integrates into the mixed graph with explicit follow-up and blocked routes while preserving full-fake behavior and downstream boundary constraints

# topic-planning-node
TOP-001: topic-planning-node — Real topic planning generates a validated structured topic plan from the checkpointed HITL1 profile via the runtime node-agent bridge with closed topic contracts, one bounded repair, and fail-closed schema validation
TOP-002: topic-planning-node — A deterministic materializer normalizes the validated plan into a stable topic registry with model-independent ids/slugs plus a must-answer coverage map and rejects duplicate or overlapping topics
TOP-003: topic-planning-node — Topic coverage and expansion are bounded by hard checks that reject empty or uncovered coverage and over-expansion and fail closed to terminal blocked after one bounded repair
TOP-004: topic-planning-node — Real topic planning records bounded planner-owned checkpoint topic state read from checkpoint profile fields without reading profile.json, declaring request-bundle or work-unit capabilities, producing a WorkSpec, writing a sandbox file, or bumping the schema version
TOP-005: topic-planning-node — Real topic planning integrates into the mixed graph only off real bootstrap and real HITL1 with one explicit exhausted route while preserving full-fake behavior and the backend/frontend boundary

# wave0-node
WAN-001: wave0-node — Real Wave0 reads the planner topic registry and materializes one immutable source-intake WorkSpec per topic through the existing work-unit controller and shared fan-out/fan-in component without a second controller or work authority
WAN-002: wave0-node — A bounded web worker agent performs per-topic source intake under a real attempt-scoped tool policy with all fetched content treated as untrusted data and writes only its own attempt artifacts
WAN-003: wave0-node — A real wave0.source-intake result contract is registered in the generalized validation registry and deterministic submit validation canonicalizes URLs, verifies fetch/cache refs, checks path/hash/source identity, and counts only accepted SubmissionRecords as coverage
WAN-004: wave0-node — A real source-floor gate replaces the fixture rule, enforces per-topic independent-source coverage at submit time with honest degraded capture, and preserves the completion/drain rule and the repair/pass/exhausted routes
WAN-005: wave0-node — Real Wave0 integrates into the mixed graph only off the real topic chain with unchanged topology while preserving the full-fake fixture path and the backend/frontend boundary

# wave1-node
WON-001: wave1-node — Wave1 planner materializes per-topic evidence WorkSpecs from profile constraints and Wave0 background coverage through the shared work-unit controller
WON-002: wave1-node — A bounded web worker performs deep evidence extraction per topic with structured claims, support/counter refs, open questions, and explicit is_new_vs_wave0 marking
WON-003: wave1-node — Submit validation enforces a per-topic new-source floor by rejecting Wave0-duplicate URLs and invokes SourceDiagnostic and ClaimVerifier critics on accepted evidence
WON-004: wave1-node — Wave1 gate enforces hard provenance, semantic coverage, critic verdict presence, and open-question resolution with bounded repair and terminal blocked routing
WON-005: wave1-node — Real Wave1 integrates into the mixed graph only off the full real chain (bootstrap, hitl1, topic_planning, wave0, targeted_evidence) with unchanged topology
WON-006: wave1-node — Open questions enter resolved, targeted-search, deferred, or requires-internal-data closed states with deterministic reducer and no silent loss

# wave2-synthesis-node
WSN-001: wave2-synthesis-node — Synthesis agent reads only accepted evidence via read-only policy and produces structured findings-index, cross-topic relations, contradictions, and candidate gaps without web tools
WSN-002: wave2-synthesis-node — Deterministic materializer writes synthesis artifacts to sandbox with structured finding schema and cross-topic ledger
WSN-003: wave2-synthesis-node — Hard gate validates finding references, structure, and accepted backing; semantic gate checks causal strength, contradiction coverage, and must-answer completeness
WSN-004: wave2-synthesis-node — Real synthesis integrates into mixed graph requiring full real chain through wave1 and preserves full-fake path with unchanged topology

TEL-001: targeted-evidence-loop — Deterministic gap router converts synthesis gaps to bounded targeted WorkSpecs per gap with scoped search dimensions
TEL-002: targeted-evidence-loop — Targeted worker performs focused web search per gap under attempt-scoped policy and produces structured evidence with backing refs
TEL-003: targeted-evidence-loop — Post-submit critic invocation validates new evidence and updates finding backing; convergence gate checks gap closure, round budgets, and fatigue
TEL-004: targeted-evidence-loop — Real targeted evidence loop integrates into mixed graph requiring full real chain through wave2_synthesis with unchanged topology

# work-unit-kernel
WOU-001: work-unit-kernel — Immutable work, attempt, candidate, and submission contracts preserve controller-assigned identity and spec integrity
WOU-002: work-unit-kernel — Typed pending and in-flight state drives bounded Send batches with deterministic fan-in and terminal monotonic reducers
WOU-003: work-unit-kernel — Deterministic submit validation fails closed on identity, schema, containment, content hash, and source-reference defects
WOU-004: work-unit-kernel — Only the controller submit path may atomically append hash-chained accepted records and publish accepted submission references
WOU-005: work-unit-kernel — Submission replay reconciles ledger and checkpoint crash windows idempotently while divergent records fail closed
WOU-006: work-unit-kernel — Per-research cross-process serialization guarantees at most one accepted winner without partial ledger publication
WOU-007: work-unit-kernel — Retry, expiry, cancellation, failure, and crash recovery preserve one-way attempt lifecycle semantics
WOU-008: work-unit-kernel — A generic drain check permits phase gating only when pending and in-flight work are empty
